[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shttps"
version = "0.1.0"
description = "SYNERGY post-quantum secure compressed transport/session protocol"
requires-python = ">=3.11"
dependencies = ["cryptography>=46"]

[project.scripts]
shttps-diagnose = "shttps.diagnostics:main"
shttps-federation = "shttps.federation_cli:main"

[project.optional-dependencies]
pq = ["liboqs-python>=0.14"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shttps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
